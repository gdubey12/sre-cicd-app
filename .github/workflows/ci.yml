name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-


      - name: Install dependencies
        run: pip install -r requirements.txt
    
      - name: Run tests
        run: python -m pytest test_app.py -v
  tests-complete:
    name: tests-complete
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "All matrix tests passed"


  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Build Docker image
        run: |
          docker build -t myapp:${{ github.sha }} .
          echo "Built image: myapp:${{ github.sha }}"

      - name: Verify image runs
        run: |
          docker run -d -p 5000:5000 --name test-container myapp:${{ github.sha }}
          sleep 3
          curl -f http://localhost:5000/health
          docker stop test-container

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Build image for scanning
        run: docker build -t myapp:scan .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
  push-to-dockerhub:
    name: Push to DockerHub
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        run: |
          docker build -t gaurav0524/sre-cicd-app:${{ github.sha }} .
          docker tag gaurav0524/sre-cicd-app:${{ github.sha }} gaurav0524/sre-cicd-app:latest
          docker push gaurav0524/sre-cicd-app:${{ github.sha }}
          docker push gaurav0524/sre-cicd-app:latest
